openapi: 3.0.0
paths:
  /v0/environment/{environment}/commits:
    get:
      description: Get a signed URL to download latest user commits in an Environment.
      operationId: getRepositoryCommits
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: includeLibFiles
          required: false
          in: query
          schema:
            type: boolean
        - name: flowName
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: string
      security:
        - api-key: []
        - BearerAuth: []
      summary: getRepositoryCommits
      tags:
        - Commits
    put:
      description: Update existing user code in Flows to an Environment. Files are required to be base64 encoded.
      operationId: postRepositoryCommits
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postRepositoryCommitsBody'
      responses:
        '200':
          description: ''
        '400':
          description: This endpoint is only for updating existing files. Any file that is passed that does not exist will throw a 400.
      security:
        - api-key: []
        - BearerAuth: []
      summary: postRepositoryCommits
      tags:
        - Commits
  /v1/environment/{environment}:
    get:
      description: Get a single Environment by name.
      operationId: getEnvironment
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The requested Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEnvironmentDTO'
        '404':
          description: Environment not found.
      security:
        - api-key: []
        - BearerAuth: []
      summary: getEnvironment
      tags:
        - Environments
  /v1/environment/{environment}/agent_templates:
    get:
      description: A list of all Agent Templates for an Environment with pagination support
      operationId: getAgentTemplates
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based indexing). Default is 1, meaning the first page starts at 1, not 0.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: number between 1 and 10000. default is 10000
          schema:
            type: number
      responses:
        '200':
          description: A list of all Agent Templates for an Environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getAgentTemplates
      tags:
        - Hosts
  /v1/environment/{environment}/agents/{id}:
    get:
      description: Get an [Agent](https://docs.ganymede.bio/app/agents/Agent) in an Environment by its id.
      operationId: getAgent
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: withHistory
          required: false
          in: query
          schema:
            default: false
            type: boolean
        - name: historyPageSize
          required: false
          in: query
          schema:
            default: 100
            type: number
        - name: historyPageNumber
          required: false
          in: query
          schema:
            default: 0
            type: number
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getAgent
      tags:
        - Agents
  /v1/environment/{environment}/agents/{id}/download:
    get:
      description: Get a signed url to download the latest [Agent](https://docs.ganymede.bio/app/agents/Agent) in an Environment by its id
      operationId: downloadAgent
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: assetType
          required: false
          in: query
          schema:
            enum:
              - Windows
              - Linux
            type: string
        - name: version
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Signed Url
          content:
            application/json:
              schema:
                type: string
      security:
        - api-key: []
        - BearerAuth: []
      summary: downloadAgent
      tags:
        - Agents
  /v1/environment/{environment}/app-configs:
    post:
      description: Create a new app configuration. This endpoint is only available to users and when using API key
      operationId: createAppConfig
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppConfigDto'
      responses:
        '201':
          description: App configuration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
      security:
        - api-key: []
        - BearerAuth: []
      summary: createAppConfig
      tags:
        - App Configs
    put:
      description: Update an app configuration. This endpoint is only available to users and when using API key
      operationId: updateAppConfig
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppConfigDto'
      responses:
        '200':
          description: App configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '404':
          description: App configuration not found
      security:
        - api-key: []
        - BearerAuth: []
      summary: updateAppConfig
      tags:
        - App Configs
  /v1/environment/{environment}/app-configs/{appId}:
    get:
      description: Get all app configurations for an app
      operationId: getAppConfigs
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: appId
          required: true
          in: path
          description: The ID of the panel app
          schema:
            type: number
        - name: allConfigs
          required: false
          in: query
          description: Whether to include all configurations, including other users
          schema:
            default: false
            type: boolean
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based indexing). Default is 1, meaning the first page starts at 1, not 0.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: number between 1 and 10000. default is 10000
          schema:
            type: number
      responses:
        '200':
          description: List of app configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppConfig'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getAppConfigs
      tags:
        - App Configs
  /v1/environment/{environment}/app-configs/{id}:
    get:
      description: Get a specific app configuration by ID
      operationId: getAppConfig
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: App configuration found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '404':
          description: App configuration not found
      security:
        - api-key: []
        - BearerAuth: []
      summary: getAppConfig
      tags:
        - App Configs
    delete:
      description: Delete an app configuration. This endpoint is only available to users and not when using API key
      operationId: deleteAppConfig
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: number
        - name: dry_run
          required: false
          in: query
          schema:
            type: boolean
      responses:
        '204':
          description: App configuration deleted successfully
        '404':
          description: App configuration not found
      security:
        - api-key: []
        - BearerAuth: []
      summary: deleteAppConfig
      tags:
        - App Configs
  /v1/environment/{environment}/audit:
    get:
      description: A list of all [audit log](https://docs.ganymede.bio/app/admin/AuditLog) entries for an Environment with pagination support.
      operationId: getAuditLog
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based). Default is 1.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of results per page, between 1 and 1000. Default is 1000. Capped below other endpoints because each audit row eagerly joins many related tables.
          schema:
            type: number
      responses:
        '200':
          description: List of audit log entries for the Environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicAuditLogDTO'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getAuditLog
      tags:
        - Audit
  /v1/environment/{environment}/connection-health:
    get:
      description: List all [Connection Health](https://docs.ganymede.bio/app/admin/ConnectionHealth) records in an Environment with pagination support.
      operationId: getConnectionHealthRecords
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number (1-based). Default 1.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: Results per page (1–10000). Default 10000.
          schema:
            type: number
      responses:
        '200':
          description: List of connection health records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecordDto'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getConnectionHealthRecords
      tags:
        - ConnectionHealth
  /v1/environment/{environment}/connection-health/{connectionId}:
    get:
      description: Get the health record for a specific Connection in an Environment.
      operationId: getConnectionHealthRecord
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The connection health record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecordDto'
        '404':
          description: Connection health record not found.
      security:
        - api-key: []
        - BearerAuth: []
      summary: getConnectionHealthRecord
      tags:
        - ConnectionHealth
  /v1/environment/{environment}/connection/{connectionId}/file:
    get:
      description: Check whether a file with the given MD5 hash has already been uploaded by a specific connection.
      operationId: fileExistsByMd5
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
        - name: md5
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Returns { exists: true } if a file with the given MD5 has been uploaded by this connection.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileExistsByMd5Response'
      security:
        - api-key: []
        - BearerAuth: []
      summary: fileExistsByMd5
      tags:
        - Files
  /v1/environment/{environment}/connections/{id}:
    get:
      description: Get a [Connection](https://docs.ganymede.bio/app/agents/Agent#installing-connections) in an Environment by its id.
      operationId: getConnection
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getConnection
      tags:
        - Connections
  /v1/environment/{environment}/custom-images:
    get:
      description: List all Custom Images in an Environment with pagination support.
      operationId: getCustomImages
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based indexing). Default is 1.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of results per page, between 1 and 10000. Default is 10000.
          schema:
            type: number
      responses:
        '200':
          description: List of Custom Images in the Environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCustomImageDTO'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getCustomImages
      tags:
        - CustomImages
  /v1/environment/{environment}/custom-images/{id}:
    get:
      description: Get a single Custom Image by id.
      operationId: getCustomImage
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The requested Custom Image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCustomImageDTO'
        '404':
          description: Custom Image not found.
      security:
        - api-key: []
        - BearerAuth: []
      summary: getCustomImage
      tags:
        - CustomImages
  /v1/environment/{environment}/dashboards:
    get:
      description: List all Dashboards in an Environment with pagination support.
      operationId: getDashboards
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based indexing). Default is 1.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of results per page, between 1 and 10000. Default is 10000.
          schema:
            type: number
      responses:
        '200':
          description: List of Dashboards in the Environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicDashboardDTO'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getDashboards
      tags:
        - Dashboards
  /v1/environment/{environment}/dashboards/{name}:
    get:
      description: Get a single Dashboard by name.
      operationId: getDashboard
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The requested Dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDashboardDTO'
        '404':
          description: Dashboard not found.
      security:
        - api-key: []
        - BearerAuth: []
      summary: getDashboard
      tags:
        - Dashboards
  /v1/environment/{environment}/export-credentials:
    get:
      description: List all [Export Credentials](https://docs.ganymede.bio/app/admin/ExportCredentials) in an Environment with pagination support. Key IDs are returned; secret key material is never exposed.
      operationId: getExportCredentials
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based). Default is 1.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: Number of results per page, between 1 and 10000. Default is 10000.
          schema:
            type: number
      responses:
        '200':
          description: List of Export Credentials for the Environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicExportCredentialDTO'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getExportCredentials
      tags:
        - ExportCredentials
  /v1/environment/{environment}/export-credentials/{name}:
    get:
      description: Get a single [Export Credential](https://docs.ganymede.bio/app/admin/ExportCredentials) by name. Key IDs are returned; secret key material is never exposed.
      operationId: getExportCredential
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The requested Export Credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExportCredentialDTO'
        '404':
          description: Export Credential not found.
      security:
        - api-key: []
        - BearerAuth: []
      summary: getExportCredential
      tags:
        - ExportCredentials
  /v1/environment/{environment}/files:
    get:
      description: A list of filtered [Files](https://docs.ganymede.bio/app/files/FileBrowser). Each File response contains its [URI](https://docs.ganymede.bio/sdk/FileTags#get_file_url), which is its unique identifier.
      operationId: getFiles
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: createdBefore
          required: false
          in: query
          description: epoch time in milliseconds
          schema:
            type: number
        - name: createdAfter
          required: false
          in: query
          description: epoch time in milliseconds
          schema:
            type: number
        - name: pageNumber
          required: false
          in: query
          description: Page number for pagination (1-based indexing). Default is 1, meaning the first page starts at 1, not 0.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: number between 1 and 10000. default is 10000
          schema:
            type: number
        - name: tag
          required: false
          in: query
          description: a tag in the format of tagName:tagValue
          schema:
            type: string
        - name: name
          required: false
          in: query
          description: name of the file
          schema:
            type: string
        - name: includeArchived
          required: false
          in: query
          description: Include archived files in results. When false or omitted, only non-archived files are returned.
          schema:
            type: boolean
      responses:
        '200':
          description: A list of filtered Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getFiles
      tags:
        - Files
  /v1/environment/{environment}/files/archive:
    put:
      description: |-
        Archive or unarchive multiple [Files](https://docs.ganymede.bio/app/files/FileBrowser) in an Environment by their URIs. Only 100 files are supported per request.
              
      operationId: bulkUpdateArchiveStatus
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArchiveStatusDto'
      responses:
        '200':
          description: Updated Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
      security:
        - api-key: []
        - BearerAuth: []
      summary: bulkUpdateArchiveStatus
      tags:
        - Files
  /v1/environment/{environment}/files/tags:
    put:
      description: |-
        Add or remove file tags in bulk. Only 100 files are supported per request.
              
      operationId: modifyFileTags
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileTagUpdateBody'
      responses:
        '200':
          description: ''
      security:
        - api-key: []
        - BearerAuth: []
      summary: modifyFileTags
      tags:
        - Files
  /v1/environment/{environment}/files/upload:
    post:
      description: |-
        Get a signed url to upload a [File](https://docs.ganymede.bio/app/files/FileBrowser) in an Environment. The url will valid for 15 minutes.
        Uploads to a Ganymede bucket will require a PUT request with the header "x-goog-content-length-range" set with value "0,10000000", the header "x-goog-meta-initiatortype" set with value "API", and the header "x-goog-meta-initiatorid" set with the initiator value that was passed in the request body.
        Uploads to a customer S3 Bucket managed by Ganymede will require a "POST" request with formData including all "formData" returned with the upload response from Ganymede as well as the field "file" with the file string contents. 
              
      operationId: uploadFile
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadBody'
      responses:
        '200':
          description: Signed Url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
        '409':
          description: File Already Exists
          content:
            application/json:
              schema:
                type: string
      security:
        - api-key: []
        - BearerAuth: []
      summary: uploadFile
      tags:
        - Files
  /v1/environment/{environment}/files/{uri}:
    get:
      description: Get a [File](https://docs.ganymede.bio/app/files/FileBrowser) in an Environment by its url-encoded [URI](https://docs.ganymede.bio/sdk/FileTags#get_file_url).
      operationId: getFile
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: uri
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: File
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getFile
      tags:
        - Files
  /v1/environment/{environment}/files/{uri}/download:
    get:
      description: Get a signed url to download a [File](https://docs.ganymede.bio/app/files/FileBrowser) in an Environment by its url-encoded [URI](https://docs.ganymede.bio/sdk/FileTags#get_file_url).
      operationId: downloadFile
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: uri
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Signed Url
          content:
            application/json:
              schema:
                type: string
      security:
        - api-key: []
        - BearerAuth: []
      summary: downloadFile
      tags:
        - Files
  /v1/environment/{environment}/flows:
    post:
      description: |-
        Create a new empty [Flow](https://docs.ganymede.bio/app/flows/FlowEditor) in an Environment.

        A unique flow id will be generated based on the provided name.
      operationId: createFlow
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlowBody'
      responses:
        '201':
          description: The Flow was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
      security:
        - api-key: []
        - BearerAuth: []
      summary: createFlow
      tags:
        - Flows
  /v1/environment/{environment}/flows/{flowId}/flowruns/{flowRunId}:
    get:
      description: Get a [FlowRun](https://docs.ganymede.bio/app/flows/FlowView#running-flows) in an Environment by its id.
      operationId: getFlowRun
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: flowId

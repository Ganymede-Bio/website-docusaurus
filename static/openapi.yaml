    HealthRecordDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          allOf:
            - $ref: '#/components/schemas/ConnectionType'
        connectionId:
          type: string
          description: The name of the backing sync Flow
        runTime:
          type: string
          description: ISO 8601
        outcome:
          allOf:
            - $ref: '#/components/schemas/RunOutcome'
        failureReason:
          nullable: true
          description: Failure category; populated only when outcome is Failed
          allOf:
            - $ref: '#/components/schemas/FailureReason'
        newRowsWritten:
          type: integer
        erroredTableCount:
          type: integer
          nullable: true
          minimum: 0
          description: Number of tables that failed to sync. Complementary to syncedTables (the successfully-synced tables); total tables attempted equals syncedTables.length + erroredTableCount. Null when the sync did not report a count (not the same as zero).
        syncedTables:
          nullable: true
          description: Tables that synced successfully — one entry per table with its row count and last-updated time. Tables that failed are excluded here and counted in erroredTableCount instead.
          type: array
          items:
            $ref: '#/components/schemas/SyncedTableDto'
        createdAt:
          type: string
          description: ISO 8601
      required:
        - id
        - type
        - connectionId
        - runTime
        - outcome
        - newRowsWritten
        - createdAt
    Host:
      type: object
      properties:
        id:
          type: string
          description: uuid for the host. will be generated if not specified in yaml
        name:
          type: string
        state:
          default: Enabled
          allOf:
            - $ref: '#/components/schemas/HostState'
        labels:
          nullable: true
          description: identifier metadata for a host
          type: array
          items:
            type: string
        updatesEnabled:
          type: boolean
          default: true
        eventConfiguration:
          $ref: '#/components/schemas/EventConfiguration'
        serviceIdentityAccountNameSecretName:
          type: string
          nullable: true
          description: The secret that should be retrieved for the account name of the specific user identity to install the connection with on the host operating system
        serviceIdentityAccountNameSecretVersion:
          type: string
          nullable: true
        serviceIdentityPasswordSecretName:
          type: string
          nullable: true
          description: The secret that should be retrieved for the password of the specific user identity to install the connection with on the host operating system
        serviceIdentityPasswordSecretVersion:
          type: string
          nullable: true
        legacyConnectionId:
          type: string
        startTime:
          format: date-time
          type: string
        inferredData:
          description: Data that is not guaranteed to be accurate. The host attempts to piece together certain contextual information on its environment.
          allOf:
            - $ref: '#/components/schemas/HostInferredData'
        apiServerTarget:
          type: string
        tenantName:
          type: string
        runningVersion:
          description: This is the actual data running on the host based on last status ping received from it. Can be used to detect discrepancies between what the host should be at.
          allOf:
            - $ref: '#/components/schemas/HostVersionMetadata'
        environment:
          type: string
          description: Temporary field to help scope a host to a specific environment until we can make it tenant-level.
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorConnection'
        description:
          type: string
        customImage:
          $ref: '#/components/schemas/CustomImage'
        expectedVersion:
          description: There are the expected version the host should be running based on any changes from the UI. Can be used to detect discrepancies between what the host should be at.
          allOf:
            - $ref: '#/components/schemas/HostVersionMetadata'
        emails:
          nullable: true
          description: email addresses associated with a host
          type: array
          items:
            type: string
        sendEmailAlerts:
          type: boolean
          description: send email alerts for host status
        disconnectAlertTimeout:
          type: number
          description: time until email alert is sent for an offline host
        disconnectAlertSent:
          type: boolean
          description: email alert has been sent for an offline host
        sendAlertOnShutdown:
          type: boolean
          description: send email alert for host shutdown event
        shouldAutoBuildOnRelease:
          type: boolean
        legacyAgentId:
          type: string
        deletedAt:
          format: date-time
          type: string
        statusMetadata:
          $ref: '#/components/schemas/HostStatusEntity'
        serviceIdentityAccountNameSecret:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Secret'
        serviceIdentityPasswordSecret:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Secret'
      required:
        - name
        - state
        - updatesEnabled
        - startTime
        - apiServerTarget
        - tenantName
        - runningVersion
        - expectedVersion
        - shouldAutoBuildOnRelease
        - statusMetadata

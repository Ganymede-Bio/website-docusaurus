          in: query
          description: Page number for pagination (1-based indexing). Default is 1, meaning the first page starts at 1, not 0.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: number between 1 and 10000. default is 10000
          schema:
            type: number
      responses:
        '200':
          description: Get all FlowRuns for a specific Flow in an Environment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowRun'
      security:
        - api-key: []
        - BearerAuth: []
      summary: getFlowRuns
      tags:
        - FlowRuns
  /v2/environment/{environment}/flows/{id}:
    get:
      description: Get a [Flow](https://docs.ganymede.bio/app/flows/FlowEditor#flows) in an Environment by its id. Returns pipeline and settings objects that can be sent directly to updateFlowPipeline and updateFlowSettings.
      operationId: getFlowV2
      parameters:
        - name: environment
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Flow with pipeline and settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowV2'
        '404':
          description: Flow not found
      security:
        - api-key: []
        - BearerAuth: []
      summary: getFlow
      tags:
        - Flows
